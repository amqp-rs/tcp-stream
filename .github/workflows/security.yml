name: Security audit

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 12 * * 1"

jobs:
  security:
    # The widest set: the called workflow narrows it per job, and only its
    # scheduled audit keeps issues: write.
    permissions:
      contents: read
      checks: write
      issues: write
    uses: amqp-rs/actions/.github/workflows/reusable-security.yml@main
