name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  build_and_test:
    uses: amqp-rs/actions/.github/workflows/reusable-build.yml@main
    with:
      setup: windows-setup-tls-env
      # The default run only covers default features: also test plaintext
      # (no features), and each TLS backend with a runtime.
      test-runs: --no-default-features
      test-features: |
        futures
        rustls,futures
        native-tls-futures,tokio
        openssl-futures,smol
        rustls-futures,rustls--ring,rustls-webpki-roots-certs,async-global-executor
