[package]
name = "tcp-stream"
version = "0.34.14"
edition = "2024"
authors = ["Marc-Antoine Perennou <Marc-Antoine@Perennou.com>"]
description = "std::net::TcpStream on steroids"
repository = "https://github.com/amqp-rs/tcp-stream"
readme = "README.md"
documentation = "https://docs.rs/tcp-stream"
keywords = ["tcp", "tls", "async", "non-blocking", "io"]
categories = ["asynchronous", "network-programming"]
license = "BSD-2-Clause"
rust-version = "1.88.0"

[lib]
name = "tcp_stream"

[features]
default                   = ["rustls-platform-verifier", "rustls--aws_lc_rs", "rustls-futures", "tokio"]
futures                   = ["dep:futures-io", "dep:async-rs"]

async-global-executor     = ["futures", "async-rs?/async-global-executor", "async-rs?/async-io"]
smol                      = ["futures", "async-rs?/smol"]
tokio                     = ["futures", "async-rs?/tokio"]

native-tls-futures        = ["dep:async-native-tls", "futures", "native-tls"]
openssl-futures           = ["dep:async-openssl", "futures", "openssl"]
rustls-futures            = ["futures", "rustls", "rustls-connector/futures"]

native-tls                = ["dep:native-tls", "dep:pkcs8", "dep:rustls-pki-types"]
openssl                   = ["dep:openssl", "dep:rustls-pki-types"]
rustls-platform-verifier  = ["rustls", "rustls-connector/platform-verifier"]
rustls-native-certs       = ["rustls", "rustls-connector/native-certs"]
rustls-webpki-roots-certs = ["rustls", "rustls-connector/webpki-root-certs"]
rustls                    = ["dep:rustls-connector", "dep:p12-keystore", "dep:rustls-pki-types"]
vendored-openssl          = ["openssl", "openssl/vendored"]

# rustls crypto providers. Choose at least one. Otherwise, runtime errors.
# See https://docs.rs/rustls/latest/rustls/#crate-features. for more info
rustls--aws_lc_rs         = ["dep:rustls-connector", "rustls-connector/rustls--aws_lc_rs"] # default, but doesn't build everywhere
rustls--ring              = ["dep:rustls-connector", "rustls-connector/rustls--ring"] # more compatible, (e.g., easily builds on Windows)

[dependencies]
cfg-if = "^1.0"

# rustix does not build on the excluded Unix targets: keep this list in sync with
# the socket check selection in src/lib.rs.
[target.'cfg(all(unix, not(any(target_os = "nuttx", target_os = "qnx", target_os = "rtems", target_os = "vxworks"))))'.dependencies]
rustix = { version = "^1.1", features = ["event", "net"] }

[target.'cfg(any(windows, target_os = "wasi"))'.dependencies]
rustix = { version = "^1.1", features = ["event"] }

[dependencies.async-native-tls]
version = "^0.6"
default-features = false
features = ["runtime-smol"] # this feature name is bad. means async traits from futures-io
optional = true

[dependencies.async-openssl]
version = "^0.2.12"
optional = true

[dependencies.async-rs]
version = "^0.8"
default-features = false
optional = true

[dependencies.futures-io]
version = "^0.3"
optional = true

[dependencies.native-tls]
version  = "^0.2"
optional = true

[dependencies.openssl]
version  = "^0.10.72"
optional = true

[dependencies.p12-keystore]
version = "^0.2"
optional = true

[dependencies.pkcs8]
version = "^0.10.2"
default-features = false
features = ["std", "pem"]
optional = true

[dependencies.rustls-connector]
version          = "^0.23"
optional         = true
default-features = false

[dependencies.rustls-pki-types]
version          = "^1.9"
optional         = true
default-features = false
features         = ["std"]

[package.metadata.docs.rs]
all-features = true

[target.'cfg(any(unix, windows))'.dev-dependencies]
socket2 = "^0.6"

# The socket check selection excludes the `qnx` target OS, which older
# toolchains do not list.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("qnx"))'] }
